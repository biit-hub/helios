# E1.1 is not approved for public deployment. Use only after E1.2 security acceptance.
# Later attach ONLY web to the existing NPM network, using an explicit override.
# postgres and worker stay on the private backend network; no host ports.
name: helios-prod
services:
  web:
    environment:
      HELIOS_ENV: production
  worker:
    environment:
      HELIOS_ENV: production

# OLLAMA_BASE_URL / OLLAMA_MODEL / OLLAMA_TIMEOUT_SECONDS are inherited from compose.yaml.
# Set the existing private LAN endpoint in the separate production environment.

# TERMIHUB_TIMEOUT_SECONDS / TERMIHUB_MAX_RESPONSE_BYTES / TERMIHUB_PRIVATE_ORIGINS
# are inherited from compose.yaml. Credentials are entered through protected settings.
