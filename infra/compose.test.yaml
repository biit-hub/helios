name: helios-test
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: helios_test
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: synthetic-test-only
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U helios -d helios_test"]
      interval: 2s
      timeout: 3s
      retries: 30
