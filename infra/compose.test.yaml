name: helios-test
services:
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: helios_test
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: synthetic-test-only
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U helios -d helios_test"]
      interval: 2s
      timeout: 3s
      retries: 30
