name: CI
on:
  push:
    branches: [main, develop, "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          {
            POSTGRES_USER: helios,
            POSTGRES_PASSWORD: synthetic-test-only,
            POSTGRES_DB: helios_test,
          }
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U helios -d helios_test" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      HELIOS_ENV: test
      DATABASE_URL: postgresql://helios:synthetic-test-only@127.0.0.1:5432/helios_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm security:secrets
      - run: pnpm audit --prod --audit-level=high
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker build -f infra/Dockerfile --target web -t helios-web:ci .
      - run: docker build -f infra/Dockerfile --target worker -t helios-worker:ci .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          {
            image-ref: "helios-web:ci",
            severity: "HIGH,CRITICAL",
            exit-code: "1",
            ignore-unfixed: true,
          }
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          {
            image-ref: "helios-worker:ci",
            severity: "HIGH,CRITICAL",
            exit-code: "1",
            ignore-unfixed: true,
          }
      - name: Compose smoke
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work node:22.23.2-bookworm-slim node scripts/init-env.mjs
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work node:22.23.2-bookworm-slim node scripts/init-auth-env.mjs
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work node:22.23.2-bookworm-slim node scripts/init-integrations-env.mjs
          docker compose up -d --wait postgres
          docker compose run --rm --no-deps worker node_modules/.bin/tsx packages/backend/src/migrate.ts
          docker compose up -d --wait web worker
          docker compose exec -T worker node_modules/.bin/tsx apps/worker/src/smoke.ts
          curl --fail http://127.0.0.1:3100/api/health/ready
          curl --fail http://127.0.0.1:3100/login > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/work)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/protected)" = "401"
      - if: always()
        run: if [ -f .env ]; then docker compose down; fi
