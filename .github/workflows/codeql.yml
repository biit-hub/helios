name: CodeQL
on:
  push: { branches: [develop, main] }
  pull_request: { branches: [develop, main] }
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with: { languages: javascript-typescript, build-mode: none }
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

